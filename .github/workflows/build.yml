name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Download Xposed API
        run: |
          mkdir -p libs/compile_only
          # API 89 is backward compatible with API 86 (xposedminversion=86)
          curl -L --connect-timeout 30 --max-time 120 \
            -o libs/compile_only/api.jar \
            "https://raw.githubusercontent.com/bywhat/XposedBridgeApi/main/XposedBridgeAPI-89.jar"
          ls -la libs/compile_only/
          file libs/compile_only/api.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceFaker-Pro-APK
          path: build/outputs/apk/release/*.apk